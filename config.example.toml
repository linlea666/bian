# bian 启动配置（安装后位于 /opt/bian/data/config.toml）。
#
# 风控阈值、邮件、币安凭证都在【网页后台 → 设置】里修改，保存后下一轮监控自动生效，不需要改这个文件。
# 这里只放启动参数；修改后执行 ./start.sh restart 生效。

[web]
host = "0.0.0.0"   # 只想通过 SSH 隧道访问时改成 127.0.0.1
port = 3100        # 避开 joz 的 3000 / 8080；记得在云服务器安全组放行（建议只放行自己的 IP）
# panel_url = "http://你的服务器IP:3100"   # 写进凭证失效邮件里的后台链接

[monitor]
stale_seconds = 120      # 超过该时间没拿到新数据 → 数据中断提醒
empty_confirm_polls = 2  # 持仓列表突然变空需连续确认几次才判定为平仓（防接口抖动）
auto_discover = true     # 自动监控你所有的跟单关系（新跟 / 取消跟单都会自动识别）
db_path = "bian.db"

# ---- 可选：观察“公开持仓”的领航员（不需要跟单，只看领航员本人的仓位）
# portfolio_id = 领航员主页 URL 里 lead-details/ 后面的数字。去掉行首的 # 即可启用。
#
# [[leaders]]
# portfolio_id = "1234567890123456789"
# source = "public"
# position_margin_u = 20   # 估算“如果我跟了”的 U 盈亏：每笔大约投入多少 U 保证金
